[features]
# Test-only helpers for building a `Compose` a downstream crate can read back:
# see `hyperion::net::test_util`. Off by default and enabled by `smash` only
# under `[dev-dependencies]`, so it is in no published surface for a normal
# build. `nix/checks/test-util-is-dev-only.nix` fails the build if any
# non-dev dependency turns it on -- a feature that exists for tests is one
# careless `features = [..]` away from being load-bearing in production, and
# by then removing it is a breaking change.
test-util = []

[dev-dependencies]
approx = { workspace = true }
divan = { workspace = true }
fastrand = { workspace = true }
hyperion-genmap = { workspace = true }
# tests/multi_proxy.rs drives the real proxy-side consumer, so that the two halves of the
# server-to-proxy wire types are checked against each other rather than each against itself.
hyperion-proxy = { workspace = true }
papaya = { workspace = true }
serial_test = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
# A dylib as well as an rlib so a dynamically loaded game module and this host resolve
# `hyperion` -- and through it the one `flecs_ecs` that owns the process-global pool
# handing out component indices -- to a single shared image. Two copies index one world
# two different ways, consistently on each side, with nothing raising an error. See
# `docs/hot-reload.md`. The rlib stays first so a consumer linking statically is
# unaffected.
crate-type = ["rlib", "dylib"]

[lints]
workspace = true

[package]
authors = ["Andrew Gazelka <andrew.gazelka@gmail.com>"]
edition.workspace = true
name = "hyperion"
publish = false
readme = "README.md"
version.workspace = true

[package.metadata.cargo-machete]
# The lib is `webpki`, not `rustls_webpki`, so cargo-machete never finds the use.
ignored = ["rustls-webpki"]
