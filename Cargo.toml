[profile]
[profile.dev]
incremental = true

[profile.release-debug]
debug = true
inherits = 'release'

[profile.release-full]
codegen-units = 1
debug = false
inherits = 'release'
lto = 'fat'
panic = 'abort'

[workspace]
members = [
    'crates/bvh',
    'crates/bvh-region',
    'crates/geometry',
    'crates/hyperion',
    'crates/hyperion-clap',
    'crates/hyperion-command',
    'crates/hyperion-crafting',
    'crates/hyperion-event-macros',
    'crates/hyperion-event-runner',
    'crates/hyperion-genmap',
    'crates/hyperion-gui',
    'crates/hyperion-hot-reload',
    'crates/hyperion-hot-reload/demo/host',
    'crates/hyperion-hot-reload/demo/index-probe-host',
    'crates/hyperion-hot-reload/demo/index-probe-module',
    'crates/hyperion-hot-reload/demo/module',
    'crates/hyperion-inventory',
    'crates/hyperion-item',
    'crates/hyperion-minecraft-proto',
    'crates/hyperion-minecraft-proto-derive',
    'crates/hyperion-packet-macros',
    'crates/hyperion-palette',
    'crates/hyperion-permission',
    'crates/hyperion-proxy',
    'crates/hyperion-proxy-proto',
    'crates/hyperion-utils',
    'crates/packet-channel',
    'events/bedwars',
    'events/smash',
    'tools/rust-mc-bot',
]
resolver = '2'

[workspace.dependencies]
aes = '0.9.2'
anyhow = "1.0.104"
# 0.6.0-rc2 rather than 0.5.1: it is the newest published version and 0.5.1
# dates from 2022. Used only by tests, through assert_relative_eq, which 0.6
# keeps. Drop the rc suffix when 0.6.0 ships.
approx = "0.6.0-rc2"
arc-swap = "1.9.2"
arrayvec = "0.7.8"
base64 = "0.23.0"
bitfield-struct = "0.13.0"
bitvec = "1.1.1"
boxcar = "0.2.14"
bumpalo = "3.20"
byteorder = '1.5.0'
bytes = "1.12.1"
cfb8 = '0.9.1'
colored = "3.1.1"
compact_str = "0.10.0"
convert_case = "0.11.0"
criterion = "0.8.2"
derive-build = '0.1.1'
directories = "6.0.0"
dotenvy = '0.15.7'
eframe = "0.35.0"
egui = "0.35.0"
egui_dock = "0.20.1"
enumset = "1.1.14"
fast_hilbert = "2.1.0"
fastrand = "2.5.0"
flume = "0.12.0"
futures-util = "0.3.33"
# Held at valence's version: `valence_protocol` exposes glam types (`Vec3`,
# `Quat`, `BlockPos`) across its whole public API, and the vendored fork pins
# 0.29.3. Anything newer here puts two glam crates in the tree and every
# valence signature stops accepting the vectors hyperion holds. Moving this
# means bumping glam in TestingPlant/valence first, on both pinned branches.
glam = "0.29.3"
heapless = "0.9.3"
heed = "0.22.1"
hex = '0.4.3'
humantime = "2.4.0"
hyperion-proxy = { path = "crates/hyperion-proxy" }
itertools = "0.15.0"
kanal = '0.1.1'
# Held on the 0.2 line: libc 1.0.0-alpha.4 is published, but every other crate
# that reaches libc here (mio, heed, flecs_ecs_sys, getrandom, ndarray and two
# dozen more) requires 0.2, so taking the alpha only adds a second libc to the
# tree without removing the first. Move when the ecosystem does.
libc = "0.2.189"
libdeflater = "1.25.2"
memmap2 = "0.9.11"
mio = { version = "1.2.2", features = ['os-poll', 'net'] }
more-asserts = '0.3.1'
num-derive = "0.5.1"
num-traits = '0.2.19'
num_cpus = "1.17.0"
once_cell = "1.21.4"
ordered-float = "5.3.0"
papaya = "0.2.4"
parking_lot = "0.12.5"
paste = "1.0.15"
plotters-bitmap = "0.3.7"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
rand = "0.10.2"
rayon = "1.12.0"
rkyv = "0.8.17"
# Held on the 0.23 line: rustls 0.24.0-dev.1 is published but is a development
# placeholder, and tokio-rustls 0.26, hyper-rustls 0.27, reqwest 0.13 and
# rustls-platform-verifier 0.7 all require 0.23. Nothing can use 0.24 until
# those do.
rustls = { version = "0.23.42", default-features = false, features = ['logging', 'std', 'tls12'] }
rustls-pki-types = "1.15.1"
# Held on the 0.103 line for the same reason as rustls above: rustls 0.23
# depends on 0.103, so 0.104.0-alpha.7 would put two webpki crates in the tree
# and hand hyperion a different WebPkiServerVerifier than rustls builds with.
rustls-webpki = "0.103.13"
serde = "1.0.229"
serde_json = "1.0.151"
serial_test = "4.0.1"
slotmap = "1.1.1"
snafu = "0.9.2"
syn = "3.0.3"
tango-bench = "0.7.2"
tar = "0.4.46"
thiserror = "2.0.19"
thread_local = "1.1.10"
tikv-jemallocator = "0.7.0"
time = "0.3.54"
tokio = "1.53.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ['logging', 'tls12'] }
toml = "1.1.3"
tracing-appender = "0.2.5"
sha2 = "0.11.0"
uuid = "1.24.0"


[workspace.dependencies.bvh]
path = 'crates/bvh'

[workspace.dependencies.bvh-region]
path = 'crates/bvh-region'

[workspace.dependencies.bytemuck]
features = ['derive']
version = "1.25.2"

[workspace.dependencies.clap]
features = ['derive']
version = "4.6.4"

[workspace.dependencies.derive_more]
features = ['display', 'from', 'into', 'deref', 'deref_mut', 'debug', 'constructor', 'add']
version = "2.1.1"

[workspace.dependencies.divan]
git = 'https://github.com/nvzqz/divan'

[workspace.dependencies.flate2]
default-features = false
version = "1.1.9"

[workspace.dependencies.flecs_ecs]
# Upstream main rather than the 0.2.2 release: it vendors flecs C 4.1.6 instead
# of 4.1.2, makes `World` and `Query` `!Send` with `QueryHandle` for the
# cross-thread case, and fixes a `QueryIter` double free. 0.2.2 is the only
# non-yanked crates.io release and is eight months behind.
#
# Carrying Indra-db/Flecs-Rust#302: main's new sparse-term safety locks hand a
# stage to `flecs_components_get`, which asserts, so every system with a sparse
# term aborts under `set_threads > 1` — which is every system here. Repin on
# upstream once that lands.
#
# Also carrying the shared-dylib change: `crate-type = ["dylib", "rlib"]` plus a
# build script that re-exports flecs's C symbols. Hot reloading needs exactly one
# copy of this crate in the process, because it owns the process-global pool that
# hands out each component type's index into a world's component array. See
# `docs/hot-reload.md`.
features = ['flecs_manual_registration']
git = 'https://github.com/andrewgazelka/Flecs-Rust'
rev = 'f09dc5308d00c6a88c82b1195334b6ed2b2d2868'

[workspace.dependencies.geometry]
path = 'crates/geometry'

[workspace.dependencies.hyperion]
path = 'crates/hyperion'

[workspace.dependencies.hyperion-clap]
path = 'crates/hyperion-clap'

