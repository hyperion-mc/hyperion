[workspace.dependencies.hyperion-item]
path = 'crates/hyperion-item'

[workspace.dependencies.hyperion-minecraft-proto]
path = 'crates/hyperion-minecraft-proto'

[workspace.dependencies.hyperion-minecraft-proto-derive]
path = 'crates/hyperion-minecraft-proto-derive'

[workspace.dependencies.hyperion-nerd-font]
