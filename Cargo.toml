[profile]
[profile.dev]
incremental = true

[profile.release-debug]
debug = true
inherits = 'release'

[profile.release-full]
codegen-units = 1
debug = false
inherits = 'release'
lto = 'fat'
panic = 'abort'

[workspace]
members = [
    'crates/bvh',
    'crates/bvh-region',
    'crates/geometry',
    'crates/hyperion',
    'crates/hyperion-clap',
    'crates/hyperion-command',
    'crates/hyperion-crafting',
    'crates/hyperion-event-macros',
    'crates/hyperion-genmap',
    'crates/hyperion-gui',
    'crates/hyperion-hot-reload',
    'crates/hyperion-hot-reload-demo',
    'crates/hyperion-hot-reload-demo-module',
    'crates/hyperion-inventory',
    'crates/hyperion-item',
    'crates/hyperion-minecraft-proto',
    'crates/hyperion-minecraft-proto-derive',
    'crates/hyperion-nerd-font',
    'crates/hyperion-packet-macros',
    'crates/hyperion-palette',
    'crates/hyperion-permission',
    'crates/hyperion-proto',
    'crates/hyperion-proxy',
    'crates/hyperion-scheduled',
    'crates/hyperion-stats',
    'crates/hyperion-text',
    'crates/hyperion-utils',
    'crates/packet-channel',
    'crates/simd-utils',
    'events/bedwars',
    'events/smash',
    'tools/packet-inspector',
    'tools/rust-mc-bot',
]
resolver = '2'

[workspace.dependencies]
aes = '0.9.2'
anyhow = '1.0.98'
approx = '0.5.1'
arc-swap = '1.7.1'
arrayvec = '0.7.4'
base64 = "0.23.0"
bitfield-struct = "0.13.0"
bitvec = '1.0.1'
boxcar = '0.2.13'
bumpalo = '3.16'
byteorder = '1.5.0'
bytes = '1.8.0'
cfb8 = '0.9.1'
colored = "3.0.0"
compact_str = '0.9.0'
convert_case = "0.11.0"
criterion = "0.8.2"
derive-build = '0.1.1'
directories = "6.0.0"
dotenvy = '0.15.7'
eframe = "0.35.0"
egui = "0.35.0"
egui_dock = "0.20.1"
enumset = '1.1.6'
fast_hilbert = '2.0.0'
fastrand = '2.1.0'
flume = "0.12.0"
futures-util = '0.3.31'
# Held at valence's version: `valence_protocol` exposes glam types (`Vec3`,
# `Quat`, `BlockPos`) across its whole public API, and the vendored fork pins
# 0.29.3. Anything newer here puts two glam crates in the tree and every
# valence signature stops accepting the vectors hyperion holds. Moving this
# means bumping glam in TestingPlant/valence first, on both pinned branches.
glam = "0.29.3"
heapless = "0.9.3"
heed = "0.22.1"
hex = '0.4.3'
humantime = '2.1.0'
hyperion-proxy = { path = "crates/hyperion-proxy" }
itertools = "0.15.0"
kanal = '0.1.1'
libc = '0.2.172'
libdeflater = '1.24.0'
memmap2 = '0.9.5'
mio = { version = '1.0.3', features = ['os-poll', 'net'] }
more-asserts = '0.3.1'
num-derive = "0.5.1"
num-traits = '0.2.19'
num_cpus = "1.16.0"
once_cell = '1.21.3'
ordered-float = "5.0.0"
papaya = "0.2.1"
parking_lot = '0.12.3'
paste = "1.0.15"
plotters-bitmap = '0.3.6'
proc-macro2 = '1.0.95'
proptest = '1.5.0'
quote = '1.0.39'
rand = "0.10.2"
rayon = '1.10.0'
rkyv = '0.8.8'
rustls = { version = '0.23.31', default-features = false, features = ['logging', 'std', 'tls12'] }
rustls-pki-types = '1.12.0'
rustls-webpki = '0.103.4'
serde = '1.0.217'
serde_json = '1.0.140'
serial_test = "4.0.1"
slotmap = '1.0.7'
snafu = "0.9.2"
syn = "3.0.3"
tango-bench = "0.7.2"
tar = '0.4.41'
thiserror = '2.0.12'
thread_local = '1.1.8'
tikv-jemallocator = "0.7.0"
time = '0.3.41'
tokio = '1.45.0'
tokio-rustls = { version = '0.26.2', default-features = false, features = ['logging', 'tls12'] }
toml = "1.1.3"
tracing-appender = '0.2.3'
sha2 = "0.11.0"
uuid = '1.16.0'


[workspace.dependencies.bvh]
path = 'crates/bvh'

[workspace.dependencies.bvh-region]
path = 'crates/bvh-region'

[workspace.dependencies.bytemuck]
features = ['derive']
version = '1.23.0'

[workspace.dependencies.clap]
features = ['derive']
version = '4.5.38'

[workspace.dependencies.derive_more]
features = ['display', 'from', 'into', 'deref', 'deref_mut', 'debug', 'constructor', 'add']
version = "2.0.1"

[workspace.dependencies.divan]
git = 'https://github.com/nvzqz/divan'

[workspace.dependencies.flate2]
default-features = false
version = '1.1.1'

[workspace.dependencies.flecs_ecs]
# Upstream main rather than the 0.2.2 release: it vendors flecs C 4.1.6 instead
# of 4.1.2, makes `World` and `Query` `!Send` with `QueryHandle` for the
# cross-thread case, and fixes a `QueryIter` double free. 0.2.2 is the only
# non-yanked crates.io release and is eight months behind.
#
# Carrying Indra-db/Flecs-Rust#302: main's new sparse-term safety locks hand a
# stage to `flecs_components_get`, which asserts, so every system with a sparse
# term aborts under `set_threads > 1` — which is every system here. Repin on
# upstream once that lands.
features = ['flecs_manual_registration']
git = 'https://github.com/andrewgazelka/Flecs-Rust'
rev = '252944dedbc80741b7cca30dea67c5be95638950'

[workspace.dependencies.geometry]
path = 'crates/geometry'

