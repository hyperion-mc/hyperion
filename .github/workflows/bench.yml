# Every trigger here is manual. Nothing in this repository runs automatically.
#
# Why: the gate ran on every pull request and every push to main, on
# GitHub-hosted runners because ix's dispatcher registers JIT runners at
# `orgs/indexable-inc` and this repository is `hyperion-mc` (ENG-10824). It
# cost roughly 29,000 runner-minutes a month, measured over a 23 hour window
# at 41 runner-minutes an hour.
#
# What that bought: nothing. The last 18 consecutive runs on main were red,
# no check is a required context on ruleset 566717 (ENG-10827), and three
# checks fail at random often enough to poison 61% of runs, so a change needed
# 2.6 attempts to pass even when it was correct.
#
# The checks themselves are not deleted and are not the problem. Every one of
# them is `nix build .#checks.x86_64-linux.<name>`, and `nix run .#ci` runs the
# lot, locally, on a machine of your choosing. That is the same command CI ran.
# Run it before you push.
#
# To re-enable: restore the `push` / `pull_request` / `merge_group` triggers.
# Do not do that until the checks are green and stay green, or this comment
# will be describing the situation again in a month.

name: Bench
on:
  workflow_dispatch:

env:
  # No -Ctarget-cpu=native: the compare job runs a baseline binary built by the
  # export job on a different runner, and hosted runners are not a uniform CPU
  # pool, so a baseline compiled for one microarchitecture dies with SIGILL on
  # another. x86-64-v3 is the common floor across the current fleet and keeps
  # the two builds comparing like with like.
  RUSTFLAGS: -Clinker=/usr/bin/clang -Clink-arg=--ld-path=/usr/local/bin/mold -Ctarget-cpu=x86-64-v3 -Zshare-generics=y -Zthreads=0

jobs:
  export:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        benchmark: [ general ] # Add your benchmarks here
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Install cargo-export
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-export
      - name: Read rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          TOOLCHAIN=$(cat rust-toolchain.toml | grep 'channel' | cut -d'"' -f2)
          echo "version=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo export
        run: cargo export target/benchmarks -- bench --bench=${{ matrix.benchmark }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench_${{ matrix.benchmark }}
          path: target/benchmarks/${{ matrix.benchmark }}

  compare:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        benchmark: [ general ] # Add your benchmarks here
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifact
        id: download
        uses: dawidd6/action-download-artifact@v7
        continue-on-error: true
        with:
          commit: ${{ github.event.pull_request.base.sha }}
          name: bench_${{ matrix.benchmark }}
          path: /tmp/bench/
      - uses: rui314/setup-mold@v1
      - name: Read rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          TOOLCHAIN=$(cat rust-toolchain.toml | grep 'channel' | cut -d'"' -f2)
          echo "version=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo bench
        if: steps.download.outcome == 'success'
        # tee, not >: redirecting stdout to the file alone means a failure shows
        # up in the log as a bare exit code with nothing to diagnose it.
        run: |
          set -o pipefail
          cargo bench --bench=${{ matrix.benchmark }} -- \
            compare /tmp/bench/${{ matrix.benchmark }} \
            | tee bench_output_${{ matrix.benchmark }}.txt
      - name: remove /tmp/bench
        if: steps.download.outcome == 'success'
        run: rm -rf /tmp/bench
      - name: Post benchmark results as PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = `bench_output_${{ matrix.benchmark }}.txt`;
            const output = fs.readFileSync(path, 'utf8');
            const originalSha = context.payload.pull_request.base.sha;
            
            const issue_number = context.issue.number;
            if(issue_number) {
              const comment = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: `### Benchmark Results for ${{ matrix.benchmark }}\n\`\`\`\n${output}\`\`\`\n\nComparing to ${originalSha}`,
              };
              await github.rest.issues.createComment(comment);
            } else {
              console.log('This action must be run in the context of a pull request');
            }