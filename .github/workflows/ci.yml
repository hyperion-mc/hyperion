name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  # Each check is the same flake app a contributor runs locally, so CI cannot
  # drift from `nix run .#ci`.
  # Job names are fixed by the merge queue ruleset on main, which requires
  # these exact contexts. The app each one runs is the same one a contributor
  # runs locally.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            app: fmt
            args: -- --check
          - name: Clippy
            app: lint
          - name: Documentation
            app: doc
          - name: Tests (ubuntu-latest)
            app: test
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#${{ matrix.app }} ${{ matrix.args }}

  # Reported, not enforced. Both fail today on debt that predates the move to
  # nix apps: cargo-deny finds RUSTSEC advisories reaching in through the
  # dependency tree plus a license rejection, and cargo-machete finds 11 unused
  # dependencies. Blocking on either would wedge every PR on work that belongs
  # to the dependency bump. Run them locally with `nix run .#deny` and
  # `nix run .#unused-deps`; they become blocking once that lands.
  audit:
    name: ${{ matrix.app }} (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [deny, unused-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#${{ matrix.app }}

  # Builds every flake app, which is what proves each one passes shellcheck and
  # that its tools resolve.
  #
  # Reported, not enforced, for the same reason as the audit jobs above: it also
  # builds `packages`, which cannot succeed yet. cargoUnit cannot vendor a lock
  # holding one crate at one version from two git sources, which this lock does
  # via tools/packet-inspector. A fix is in flight in the index repo. Main's
  # `nix build` is broken today anyway, on a divan hash that matches no git
  # dependency, so nothing regresses by landing this first.
  flake:
    name: Flake
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --accept-flake-config

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#coverage
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hyperion-mc/hyperion
