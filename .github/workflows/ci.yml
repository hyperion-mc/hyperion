# Every trigger here is manual. Nothing in this repository runs automatically.
#
# Why: the gate ran on every pull request and every push to main, on
# GitHub-hosted runners because ix's dispatcher registers JIT runners at
# `orgs/indexable-inc` and this repository is `hyperion-mc` (ENG-10824). It
# cost roughly 29,000 runner-minutes a month, measured over a 23 hour window
# at 41 runner-minutes an hour.
#
# What that bought: nothing. The last 18 consecutive runs on main were red,
# no check is a required context on ruleset 566717 (ENG-10827), and three
# checks fail at random often enough to poison 61% of runs, so a change needed
# 2.6 attempts to pass even when it was correct.
#
# The checks themselves are not deleted and are not the problem. Every one of
# them is `nix build .#checks.x86_64-linux.<name>`, and `nix run .#ci` runs the
# lot, locally, on a machine of your choosing. That is the same command CI ran.
# Run it before you push.
#
# To re-enable: restore the `push` / `pull_request` / `merge_group` triggers.
# Do not do that until the checks are green and stay green, or this comment
# will be describing the situation again in a month.

name: CI

on:
  workflow_dispatch:

jobs:
  # Each check is the same flake app a contributor runs locally, so CI cannot
  # drift from `nix run .#ci`.
  #
  # A previous version of this comment said the job names were fixed by the
  # merge queue ruleset, "which requires these exact contexts". It does not:
  # ruleset 566717 on main carries no `required_status_checks` rule and the
  # branch has no classic protection either, so today nothing here is a
  # required context and a red job does not block a merge on its own. Renaming
  # a job is therefore safe and enforcement is weaker than it reads. ENG-10827.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            app: fmt
            args: -- --check
          - name: Clippy
            app: lint
          - name: Documentation
            app: doc
          - name: Tests (ubuntu-latest)
            app: test
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#${{ matrix.app }} ${{ matrix.args }}

  # Blocking as of the dependency bump. Every advisory still ignored and every
  # licence still excepted is named, with its reason, in deny.toml.
  audit:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [deny, unused-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#${{ matrix.app }}

  # Every flake check, built, and no longer advisory: a failure fails the run.
  # It is not literally a required context, because this repository has none;
  # see the note on `check` above and ENG-10827.
  #
  # What it enforces and what it does not is nix/ci/flake-gate.nix, by name,
  # and an excluded check is rebuilt here and required to still fail, so an
  # exception cannot outlive its defect. This job used to be
  # `continue-on-error: true` behind a paragraph of prose; ENG-10817 has the
  # measurement of what that cost.
  #
  # runs-on is a hosted runner and the house rule says fleet self-hosted. The
  # fleet cannot serve this repo: ix `crates/ci/dispatcher/src/config.rs` holds
  # `GithubApp.org` as one `String`, and `github.rs` registers every JIT runner
  # at `orgs/{org}` with org = indexable-inc, so a hyperion-mc job is never
  # offered one. ENG-10824 tracks making the dispatcher multi-org. Until it
  # lands, `nix build .#checks.x86_64-linux.<name>` is the same command here as
  # on the fleet, so nothing about the gate has to change when it does.
  flake:
    name: Flake
    runs-on: ubuntu-latest
    # A runner-level guard, not a target. The gate realises every check from a
    # cold hosted store in one `nix build --keep-going`, so nix schedules them
    # up to `max-jobs` (auto, four here) rather than one at a time. The floor is
    # the release compile plus the longest single gate behind it: on run
    # 30500640846 that was roughly 500 seconds of crate graph and then
    # `smash-e2e` at 639.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # The DAEMON is what decides whether a content-addressed derivation
          # can be realised, and cargoUnit content-addresses every crate unit.
          # `extra-experimental-features` in the flake's nixConfig or in
          # NIX_CONFIG reaches the client only: measured on run 30341528713,
          # both of those leave a CA build failing while extra-conf here
          # succeeds. The gate re-checks this itself and says so if it is lost.
          extra-conf: |
            extra-experimental-features = ca-derivations
      - run: nix run --accept-flake-config .#flake-gate

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run --accept-flake-config .#coverage
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hyperion-mc/hyperion
