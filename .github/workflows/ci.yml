name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  # Each check is the same flake app a contributor runs locally, so CI cannot
  # drift from `nix run .#ci`.
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: fmt
            args: -- --check
          - app: lint
          - app: doc
          - app: test
          - app: deny
          - app: unused-deps
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run .#${{ matrix.app }} ${{ matrix.args }}

  # Builds every flake app, which is what proves each one passes shellcheck and
  # that its tools resolve.
  flake:
    name: Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: nix run .#coverage
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hyperion-mc/hyperion

  # Nix does not run on Windows, so this one job still drives cargo directly.
  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          TOOLCHAIN=$(cat rust-toolchain.toml | grep 'channel' | cut -d'"' -f2)
          echo "version=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - run: cargo test --all-features
